<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Artists</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
dc-import{display:block}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
.arow{display:flex;align-items:center;gap:14px;min-height:68px;padding:8px 14px 8px 10px;border-radius:16px;background:#4C4C47;color:#FFFFFF;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.mono{width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:#3A3A36;color:#E5DCC5;font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:800;font-size:18px;box-shadow:inset 0 0 0 3px #4C4C47,inset 0 0 0 4px rgba(229,220,197,.5)}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #2D2D2A; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif">
  <header style="padding: 56px 20px 0">
    <h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Artists</h1>
    <p style="margin: 4px 0 0; font-size: 14px; color: #D9D5CA">18 artists</p>
  </header>
  <ul aria-label="Artists" style="list-style: none; margin: 18px 0 0; padding: 0 12px 200px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{artists}}" as="a" hint-placeholder-count="7">
      <li>
        <a class="arow" href="Artist.dc.html">
          <span class="mono" aria-hidden="true">{{a.initial}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="font-size: 16px; font-weight: 600">{{a.name}}</span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #CCC8BC">
              <sc-if value="{{a.local}}" hint-placeholder-val="{{ false }}"><span style="padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #EDEAE2; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35)">On this device</span></sc-if>
              {{a.count}}
            </span>
          </span>
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: #CCC8BC"><path d="m9 18 6-6-6-6"></path></svg>
        </a>
      </li>
    </sc-for>
  </ul>
  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="MiniPlayer" hint-size="390px,80px"></dc-import>
    <dc-import name="TabBar" active="artists" hint-size="390px,88px"></dc-import>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['Ines Caldera', 4], ['Juniper Hall', 7], ['Marigold Trio', 3], ['Marina Okafor', 6],
      ['Northbound Static', 9], ['Paulo Verde', 5], ['The Low Tides', 12], ['Wren Atlas', 2, true]
    ];
    return {
      artists: raw.map(([name, n, local]) => ({ name, local: !!local, initial: name.charAt(0), count: n + (n === 1 ? ' song' : ' songs') }))
    };
  }
}
</script>
</body>
</html>
