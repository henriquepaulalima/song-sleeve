<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rail{display:flex;gap:12px;overflow-x:auto;padding:0 20px 4px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.h2{margin:0;font-family:'Archivo',sans-serif;font-stretch:118%;font-weight:800;font-size:19px;letter-spacing:-0.01em}
.see{display:inline-flex;align-items:center;gap:2px;min-height:36px;padding:0 8px 0 14px;border-radius:999px;background:#4C4C47;color:#FFFFFF;font-size:13px;font-weight:600;text-decoration:none}
.card{text-decoration:none;color:#FFFFFF;border-radius:14px}
a:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #2D2D2A; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 60px 20px 8px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 34px; height: 34px; border-radius: 9px; background: #4C4C47; position: relative; overflow: hidden; display: block; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1)">
        <span style="position: absolute; right: -10px; top: 6px; width: 22px; height: 22px; border-radius: 50%; background: #F26419; box-shadow: 0 0 0 5px #161615"></span>
      </span>
      <span style="font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">Song Sleeve</span>
    </div>
    <a href="AddSongs.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px 0 12px; border-radius: 14px; background: #F26419; color: #161615; font-weight: 700; font-size: 14px; text-decoration: none">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M12 5v14M5 12h14"></path></svg>
      Add songs
    </a>
  </header>

  <section aria-labelledby="h-songs" style="margin-top: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px 10px">
      <h2 id="h-songs" class="h2">Songs <span style="font-family: 'Instrument Sans', sans-serif; font-stretch: 100%; font-size: 12px; font-weight: 500; color: #CCC8BC; letter-spacing: 0">· newest first</span></h2>
      <a class="see" href="Library.dc.html" aria-label="See all songs">See all <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="m9 18 6-6-6-6"></path></svg></a>
    </div>
    <div class="rail">
      <sc-for list="{{songs}}" as="s" hint-placeholder-count="4">
        <a class="card" href="Playing.dc.html" style="flex: none; width: 104px; display: flex; flex-direction: column; gap: 8px">
          <span style="width: 104px; height: 104px; border-radius: 12px; background: #4C4C47; color: #E5DCC5; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 10px 18px -10px rgba(0,0,0,.7)">
            <span style="position: absolute; inset: 7px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1)"></span>
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 30px; height: 30px"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            <sc-if value="{{s.local}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 6px; bottom: 6px; padding: 2px 6px; border-radius: 6px; background: #2D2D2A; color: #EDEAE2; font-size: 10px; font-weight: 700; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35)">On this device</span></sc-if>
          </span>
          <span style="display: flex; flex-direction: column; gap: 1px; min-height: 36px">
            <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
            <span style="font-size: 12px; color: #D9D5CA; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.artist}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </section>

  <section aria-labelledby="h-groups" style="margin-top: 22px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px 10px">
      <h2 id="h-groups" class="h2">Groups <span style="font-family: 'Instrument Sans', sans-serif; font-stretch: 100%; font-size: 12px; font-weight: 500; color: #CCC8BC; letter-spacing: 0">· newest first</span></h2>
      <a class="see" href="Library.dc.html" aria-label="See all groups">See all <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="m9 18 6-6-6-6"></path></svg></a>
    </div>
    <div class="rail">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <a class="card" href="Group.dc.html" style="flex: none; width: 214px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 10px; background: #4C4C47; box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 10px 18px -12px rgba(0,0,0,.7)">
          <span aria-hidden="true" style="position: relative; width: 60px; height: 60px; flex: none">
            <span style="position: absolute; left: 10px; top: 0; width: 46px; height: 46px; border-radius: 8px; background: #6E6E67; transform: rotate(10deg)"></span>
            <span style="position: absolute; left: 5px; top: 5px; width: 46px; height: 46px; border-radius: 8px; background: #5E5E58; transform: rotate(4deg)"></span>
            <span style="position: absolute; left: 0; top: 12px; width: 48px; height: 48px; border-radius: 8px; background: #3A3A36; color: #E5DCC5; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1)">
              <svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="m12 2 10 5-10 5L2 7z"></path><path d="m2 17 10 5 10-5"></path><path d="m2 12 10 5 10-5"></path></svg>
            </span>
          </span>
          <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-size: 15px; font-weight: 600">{{g.name}}</span>
            <span style="font-size: 12px; color: #CCC8BC">{{g.meta}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </section>

  <section aria-labelledby="h-playlists" style="margin-top: 22px">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px 10px">
      <h2 id="h-playlists" class="h2">Playlists <span style="font-family: 'Instrument Sans', sans-serif; font-stretch: 100%; font-size: 12px; font-weight: 500; color: #CCC8BC; letter-spacing: 0">· newest first</span></h2>
      <a class="see" href="Library.dc.html" aria-label="See all playlists">See all <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="m9 18 6-6-6-6"></path></svg></a>
    </div>
    <div class="rail">
      <sc-for list="{{playlists}}" as="p" hint-placeholder-count="3">
        <a class="card" href="Playlist.dc.html" style="flex: none; width: 214px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 10px; background: #4C4C47; box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 10px 18px -12px rgba(0,0,0,.7)">
          <span aria-hidden="true" style="position: relative; width: 60px; height: 60px; flex: none">
            <span style="position: absolute; left: 10px; top: 0; width: 50px; height: 50px; border-radius: 8px; background: #5E5E58"></span>
            <span style="position: absolute; left: 0; top: 10px; width: 50px; height: 50px; border-radius: 8px; background: #3A3A36; color: #E5DCC5; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1)">
              <svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="M21 15V6"></path><circle cx="18.5" cy="15.5" r="2.5"></circle><path d="M12 12H3"></path><path d="M16 6H3"></path><path d="M12 18H3"></path></svg>
            </span>
          </span>
          <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-size: 15px; font-weight: 600">{{p.name}}</span>
            <span style="font-size: 12px; color: #CCC8BC">{{p.meta}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="MiniPlayer" hint-size="390px,80px"></dc-import>
    <dc-import name="TabBar" active="home" hint-size="390px,88px"></dc-import>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      songs: [
        { name: 'Rehearsal take 3', artist: '', local: true },
        { name: 'Night Market', artist: 'Ines Caldera' },
        { name: 'Harbor Lights', artist: 'Marina Okafor' },
        { name: 'Copper Sky', artist: 'The Low Tides' },
        { name: 'Saltwater Hymn', artist: 'Juniper Hall' }
      ],
      groups: [
        { name: 'Travel', meta: '3 playlists · 41 songs' },
        { name: 'Moods', meta: '4 playlists · 63 songs' },
        { name: 'Work', meta: '2 playlists · 28 songs' }
      ],
      playlists: [
        { name: 'Sunday Drive', meta: '14 songs · 52 min' },
        { name: 'Late Night', meta: '22 songs · 1 h 24 min' },
        { name: 'Focus', meta: '31 songs · 2 h 3 min' }
      ]
    };
  }
}
</script>
</body>
</html>
