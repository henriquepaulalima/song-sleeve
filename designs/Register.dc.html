<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Register</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
.lbl{font-size:14px;font-weight:600}
.in{width:100%;box-sizing:border-box;min-height:52px;padding:0 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.22);background:#4C4C47;color:#FFFFFF;font:400 16px 'Instrument Sans',sans-serif;outline:none}
.in::placeholder{color:#ADA99E}
.seg{flex:1;display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:11px;font-size:15px;font-weight:600;text-decoration:none}
.sel{min-height:40px;padding:0 30px 0 12px;border-radius:12px;border:0;background:#3A3A36;color:#FFFFFF;font:600 13px 'Instrument Sans',sans-serif;appearance:none;-webkit-appearance:none}
.rule{display:flex;align-items:center;gap:8px;font-size:13px}
</style>
</helmet>
<main style="width: 390px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #2D2D2A; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif; padding: 48px 24px 36px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Back to start" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #4C4C47; color: #FFFFFF; box-shadow: inset 0 1px 0 rgba(255,255,255,.1)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="position: relative; display: inline-flex; align-items: center">
      <label for="lang" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Language</label>
      <select id="lang" class="sel"><option>English</option><option lang="pt-BR">Português (Brasil)</option></select>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; right: 10px; width: 14px; height: 14px; pointer-events: none; color: #CCC8BC"><path d="m6 9 6 6 6-6"></path></svg>
    </span>
  </div>

  <h1 style="margin: 24px 0 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 32px; letter-spacing: -0.02em; line-height: 1.05">Create your account</h1>

  <nav aria-label="Account" style="margin-top: 20px; display: flex; gap: 4px; padding: 4px; border-radius: 15px; background: #3A3A36">
    <a class="seg" href="Login.dc.html" style="color: #FFFFFF">Log in</a>
    <a class="seg" href="Register.dc.html" aria-current="page" style="background: #E5DCC5; color: #161615">Register</a>
  </nav>

  <form style="margin-top: 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label class="lbl" for="em">Email</label>
      <input class="in" id="em" type="email" autocomplete="email" value="{{email}}" onChange="{{onEmail}}" aria-invalid="{{emailInvalid}}" aria-describedby="em-err" style="border-color: {{emailBorder}}">
      <sc-if value="{{taken}}" hint-placeholder-val="{{ false }}">
        <p id="em-err" role="alert" style="margin: 0; display: flex; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #E5DCC5; color: #161615; font-size: 13px; line-height: 1.4"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; margin-top: 1px; stroke-width: 2.4"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path></svg><span>An account with this email already exists. <a href="Login.dc.html" style="color: #161615; font-weight: 700">Log in</a> or <a href="ForgotPassword.dc.html" style="color: #161615; font-weight: 700">reset your password</a>.</span></p>
      </sc-if>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label class="lbl" for="pw">Password</label>
      <input class="in" id="pw" type="password" autocomplete="new-password" value="{{pw}}" onChange="{{onPw}}" aria-describedby="pw-rules" placeholder="At least 10 characters">
      <ul id="pw-rules" aria-live="polite" style="list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{rules}}" as="r" hint-placeholder-count="2">
          <li class="rule" style="color: {{r.color}}">
            <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: {{r.dotBg}}; box-shadow: {{r.dotRing}}; color: #161615; flex: none">
              <sc-if value="{{r.ok}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" style="width: 12px; height: 12px; stroke-width: 3"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
            </span>
            {{r.text}}<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">{{r.sr}}</span>
          </li>
        </sc-for>
      </ul>
    </div>
    <label style="display: flex; align-items: flex-start; gap: 12px; padding: 12px; border-radius: 14px; background: #4C4C47; cursor: pointer">
      <input type="checkbox" checked="{{terms}}" onChange="{{onTerms}}" style="width: 22px; height: 22px; margin: 0; accent-color: #E5DCC5; flex: none">
      <span style="font-size: 14px; line-height: 1.45">I agree to the <a href="Site.dc.html" style="color: #E5DCC5; font-weight: 600">Terms of Use</a> and <a href="Site.dc.html" style="color: #E5DCC5; font-weight: 600">Privacy Policy</a></span>
    </label>
  </form>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <button type="button" onClick="{{submit}}" disabled="{{cantSubmit}}" style="min-height: 56px; border-radius: 16px; border: 0; background: {{btnBg}}; color: {{btnFg}}; font: 700 16px 'Instrument Sans', sans-serif; cursor: pointer">Create account</button>
    <p style="margin: 0; text-align: center; font-size: 13px; color: #CCC8BC">You're signed in right away. No verification email.</p>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["typing","emailTaken"],"default":"typing"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { email: 'alex@example.com', pw: 'tidewater', terms: false, tried: false };
  }
  renderVals() {
    const st = this.state;
    const taken = (this.props.variant ?? 'typing') === 'emailTaken' || st.tried;
    const common = ['password1234', '1234567890', 'qwertyuiop', 'iloveyou12'];
    const len = st.pw.length >= 10 && st.pw.length <= 128;
    const notCommon = st.pw.length > 0 && !common.includes(st.pw.toLowerCase());
    const rule = (ok, text) => ({
      ok, text,
      sr: ok ? ' (done)' : ' (not yet)',
      color: ok ? '#FFFFFF' : '#CCC8BC',
      dotBg: ok ? '#E5DCC5' : 'transparent',
      dotRing: ok ? 'none' : 'inset 0 0 0 1.5px #ADA99E'
    });
    const valid = len && notCommon && st.terms && st.email.includes('@');
    return {
      email: st.email,
      pw: st.pw,
      terms: st.terms,
      taken,
      emailInvalid: taken ? 'true' : 'false',
      emailBorder: taken ? '#E5DCC5' : 'rgba(255,255,255,.22)',
      rules: [rule(len, '10 to 128 characters, any kind'), rule(notCommon, 'Not one of the most common passwords')],
      cantSubmit: !valid,
      btnBg: valid ? '#F26419' : '#5A5A54',
      btnFg: valid ? '#161615' : '#8E8B82',
      onEmail: (e) => this.setState({ email: e.target.value, tried: false }),
      onPw: (e) => this.setState({ pw: e.target.value }),
      onTerms: (e) => this.setState({ terms: e.target.checked }),
      submit: () => this.setState({ tried: true })
    };
  }
}
</script>
</body>
</html>
