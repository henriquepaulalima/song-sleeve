<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Group · desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#2D2D2A}
dc-import{display:block;width:100%}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.f{fill:currentColor;stroke:none}
a:focus-visible,button:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
.cb{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex:none}
.rb{width:48px;height:48px;border-radius:50%;border:0;background:#4C4C47;color:#FFFFFF;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 8px 16px -10px rgba(0,0,0,.7);flex:none}
.grid{display:grid;grid-template-columns:44px minmax(0,2fr) 140px 120px 44px;align-items:center;column-gap:14px}
.th{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#D9D5CA;padding:0 4px 6px}
.r{position:relative;min-height:76px;padding:0 6px;border-radius:16px;background:#4C4C47}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 14px;border:0;border-radius:10px;background:none;color:#FFFFFF;font:500 15px 'Instrument Sans',sans-serif;text-align:left;cursor:pointer;text-decoration:none}
.mi:hover{background:#4C4C47}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #2D2D2A; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif">
  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">
    <div style="flex: 1 1 240px; max-width: 100%; display: flex; background: #4C4C47; box-shadow: 1px 0 0 rgba(255,255,255,.06)"><dc-import name="WebSidebar" active="library" current="Travel" hint-size="100%,900px"></dc-import></div>

    <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 28px clamp(16px, 3vw, 40px) 48px">
      <div style="max-width: 1120px; margin: 0 auto">
        <nav aria-label="Breadcrumb" style="font-size: 13px; color: #D9D5CA"><a href="WebLibrary.dc.html" style="color: #FFFFFF">Library</a> <span aria-hidden="true">/</span> Groups</nav>

        <header style="margin-top: 16px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 24px">
          <span aria-hidden="true" style="position: relative; width: 168px; height: 168px; flex: none">
            <span style="position: absolute; left: 30px; top: 0; width: 128px; height: 128px; border-radius: 16px; background: #6E6E67; transform: rotate(10deg)"></span>
            <span style="position: absolute; left: 16px; top: 12px; width: 128px; height: 128px; border-radius: 16px; background: #5E5E58; transform: rotate(4deg)"></span>
            <span style="position: absolute; left: 0; top: 28px; width: 136px; height: 136px; border-radius: 16px; background: #4C4C47; color: #E5DCC5; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 24px 36px -18px rgba(0,0,0,.85)"><svg class="i" viewBox="0 0 24 24" style="width: 44px; height: 44px; stroke-width: 1.8"><path d="m12 2 10 5-10 5L2 7z"></path><path d="m2 17 10 5 10-5"></path><path d="m2 12 10 5 10-5"></path></svg></span>
          </span>
          <div style="flex: 1 1 300px; min-width: 0">
            <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #D9D5CA">GROUP</div>
            <h1 style="margin: 6px 0 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 44px; letter-spacing: -0.02em; line-height: 1.05">Travel</h1>
            <p style="margin: 10px 0 0; font-size: 14px; color: #D9D5CA">3 playlists · 41 songs</p>
          </div>
          <div style="display: flex; align-items: center; gap: 10px">
            <a href="WebSyncCloud.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 16px; background: #4C4C47; color: #FFFFFF; text-decoration: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.07)">
              <span style="width: 40px; height: 40px; border-radius: 12px; background: #F26419; color: #161615; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M12 13v8"></path><path d="m8 17 4-4 4 4"></path><path d="M20.4 15.6A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.3"></path></svg></span>
              <span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px; font-weight: 600">Sync to cloud</strong><span style="font-size: 12px; color: #CCC8BC">5 songs here are only on this computer</span></span>
            </a>
            <a class="rb" href="WebCollectionDialogs.dc.html" aria-label="Group options: rename group, delete group (playlists stay)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle class="f" cx="5" cy="12" r="1.7"></circle><circle class="f" cx="12" cy="12" r="1.7"></circle><circle class="f" cx="19" cy="12" r="1.7"></circle></svg></a>
          </div>
        </header>

        <div style="margin-top: 30px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap">
          <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .06em; color: #D9D5CA">PLAYLISTS IN THIS GROUP</h2>
          <a href="WebCollectionDialogs.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 12px; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 5v14M5 12h14"></path></svg>Add playlists</a>
        </div>
        <div style="margin-top: 12px; overflow-x: auto; padding-bottom: 160px">
          <div role="list" aria-label="Playlists in Travel, group order" style="min-width: 620px; display: flex; flex-direction: column; gap: 8px">
            <div class="grid" aria-hidden="true"><span></span><span class="th">PLAYLIST</span><span class="th">SONGS</span><span class="th">LENGTH</span><span></span></div>
            <sc-for list="{{lists}}" as="p" hint-placeholder-count="3">
              <div class="grid r" role="listitem" style="z-index: {{p.z}}">
                <button class="cb" type="button" aria-label="Reorder {{p.name}}" style="color: #ADA99E; cursor: grab"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><circle class="f" cx="9" cy="6" r="1.5"></circle><circle class="f" cx="15" cy="6" r="1.5"></circle><circle class="f" cx="9" cy="12" r="1.5"></circle><circle class="f" cx="15" cy="12" r="1.5"></circle><circle class="f" cx="9" cy="18" r="1.5"></circle><circle class="f" cx="15" cy="18" r="1.5"></circle></svg></button>
                <a href="WebPlaylist.dc.html" style="display: flex; align-items: center; gap: 14px; min-width: 0; color: #FFFFFF; text-decoration: none; font-weight: 600; font-size: 16px">
                  <span aria-hidden="true" style="position: relative; width: 58px; height: 58px; flex: none">
                    <span style="position: absolute; left: 10px; top: 0; width: 48px; height: 48px; border-radius: 8px; background: #5E5E58"></span>
                    <span style="position: absolute; left: 0; top: 10px; width: 48px; height: 48px; border-radius: 8px; background: #3A3A36; color: #E5DCC5; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1)"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="M21 15V6"></path><circle cx="18.5" cy="15.5" r="2.5"></circle><path d="M12 12H3"></path><path d="M16 6H3"></path><path d="M12 18H3"></path></svg></span>
                  </span>
                  <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.name}}</span>
                </a>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #D9D5CA">{{p.count}}</span>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #D9D5CA">{{p.len}}</span>
                <span style="position: relative">
                  <button class="cb" type="button" onClick="{{p.toggle}}" aria-haspopup="menu" aria-expanded="{{p.expanded}}" aria-label="More actions for {{p.name}}" style="background: {{p.moreBg}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle class="f" cx="5" cy="12" r="1.7"></circle><circle class="f" cx="12" cy="12" r="1.7"></circle><circle class="f" cx="19" cy="12" r="1.7"></circle></svg></button>
                  <sc-if value="{{p.open}}" hint-placeholder-val="{{ false }}">
                    <div role="menu" aria-label="{{p.name}} actions" style="position: absolute; right: 0; top: 52px; width: 260px; padding: 6px; border-radius: 16px; background: #3A3A36; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 24px 40px -14px rgba(0,0,0,.9)">
                      <a class="mi" role="menuitem" href="WebCollectionDialogs.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>Rename playlist</a>
                      <a class="mi" role="menuitem" href="WebCollectionDialogs.dc.html"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M5 12h14"></path></svg>Remove from group</a>
                      <div aria-hidden="true" style="height: 1px; margin: 4px 10px; background: rgba(255,255,255,.08)"></div>
                      <a class="mi" role="menuitem" href="WebCollectionDialogs.dc.html" style="align-items: flex-start; padding-top: 10px; padding-bottom: 10px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: #F26419; margin-top: 1px"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg><span style="display: flex; flex-direction: column; gap: 2px"><span>Delete playlist…</span><span style="font-size: 12px; color: #CCC8BC">It leaves every group. Songs stay.</span></span></a>
                    </div>
                  </sc-if>
                </span>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div style="position: sticky; bottom: 0; z-index: 5; background: #4C4C47; box-shadow: 0 -16px 30px -16px rgba(0,0,0,.6)"><dc-import name="WebPlayer" hint-size="100%,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 1 };
  }
  renderVals() {
    const raw = [
      { name: 'Sunday Drive', count: '14', len: '52 min' },
      { name: 'Road Trip', count: '19', len: '1 h 11 min' },
      { name: 'Airport Lounge', count: '11', len: '44 min' }
    ];
    return {
      lists: raw.map((p, i) => {
        const open = this.state.open === i;
        return {
          ...p,
          open,
          z: open ? 3 : 1,
          expanded: open ? 'true' : 'false',
          moreBg: open ? '#3A3A36' : 'transparent',
          toggle: () => this.setState({ open: this.state.open === i ? -1 : i })
        };
      })
    };
  }
}
</script>
</body>
</html>
