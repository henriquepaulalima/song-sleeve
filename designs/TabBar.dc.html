<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bottom navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;text-decoration:none;font-size:11px;letter-spacing:.02em;border-radius:12px}
.tab:focus-visible{outline:2px solid #E5DCC5;outline-offset:-2px}
</style>
</helmet>
<nav aria-label="Main" style="width: 390px; box-sizing: border-box; display: flex; padding: 6px 8px 26px; background: #4C4C47; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif; box-shadow: 0 -1px 0 rgba(255,255,255,.07)">
  <a class="tab" href="Home.dc.html" aria-current="{{home.current}}" style="color: {{home.color}}; font-weight: {{home.weight}}">
    <span style="position: absolute; top: -6px; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: {{home.bar}}"></span>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg>
    <span>Home</span>
  </a>
  <a class="tab" href="Library.dc.html" aria-current="{{library.current}}" style="color: {{library.color}}; font-weight: {{library.weight}}">
    <span style="position: absolute; top: -6px; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: {{library.bar}}"></span>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
    <span>Library</span>
  </a>
  <a class="tab" href="Songs.dc.html" aria-current="{{songs.current}}" style="color: {{songs.color}}; font-weight: {{songs.weight}}">
    <span style="position: absolute; top: -6px; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: {{songs.bar}}"></span>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15V6"></path><circle cx="18.5" cy="15.5" r="2.5"></circle><path d="M12 12H3"></path><path d="M16 6H3"></path><path d="M12 18H3"></path></svg>
    <span>Songs</span>
  </a>
  <a class="tab" href="Artists.dc.html" aria-current="{{artists.current}}" style="color: {{artists.color}}; font-weight: {{artists.weight}}">
    <span style="position: absolute; top: -6px; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: {{artists.bar}}"></span>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M19 10v1a7 7 0 0 1-14 0v-1"></path><path d="M12 18v4"></path></svg>
    <span>Artists</span>
  </a>
  <a class="tab" href="Profile.dc.html" aria-current="{{profile.current}}" style="color: {{profile.color}}; font-weight: {{profile.weight}}">
    <span style="position: absolute; top: -6px; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: {{profile.bar}}"></span>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
    <span>Profile</span>
  </a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","library","songs","artists","profile"],"default":"home"},"$preview":{"width":390,"height":88}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const t = (k) => a === k
      ? { color: '#E5DCC5', weight: '700', bar: '#F26419', current: 'page' }
      : { color: '#CCC8BC', weight: '500', bar: 'transparent', current: 'false' };
    return { home: t('home'), library: t('library'), songs: t('songs'), artists: t('artists'), profile: t('profile') };
  }
}
</script>
</body>
</html>
