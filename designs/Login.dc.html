<style>
body{margin:0}

<main style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #2D2D2A; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif; padding: 48px 24px 40px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Back to start" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #4C4C47; color: #FFFFFF; box-shadow: inset 0 1px 0 rgba(255,255,255,.1)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <span style="position: relative; display: inline-flex; align-items: center">

      <select id="lang" class="sel"><option>English</option><option lang="pt-BR">Português (Brasil)</option></select>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; right: 10px; width: 14px; height: 14px; pointer-events: none; color: #CCC8BC"><path d="m6 9 6 6 6-6"></path></svg>
    </span>
  </div>

  <h1 style="margin: 28px 0 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 34px; letter-spacing: -0.02em; line-height: 1.05">Welcome back</h1>
  <p style="margin: 8px 0 0; font-size: 15px; color: #D9D5CA">Log in to see your library on this phone.</p>

  <nav aria-label="Account" style="margin-top: 26px; display: flex; gap: 4px; padding: 4px; border-radius: 15px; background: #3A3A36">
    <a class="seg" href="Login.dc.html" aria-current="page" style="background: #E5DCC5; color: #161615">Log in</a>

    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">

      </div>
      <input class="in" id="pw" type="password" autocomplete="current-password" placeholder="Your password">
    </div>
  </form>
  <p style="margin: 14px 0 0; font-size: 13px; line-height: 1.45; color: #CCC8BC">You'll stay signed in on this phone for 90 days.</p>
