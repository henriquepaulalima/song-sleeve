<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Songs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
dc-import{display:block}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
.search{width:100%;box-sizing:border-box;min-height:46px;padding:0 14px 0 42px;border-radius:14px;border:0;background:#4C4C47;color:#FFFFFF;font:400 15px 'Instrument Sans',sans-serif}
.search::placeholder{color:#ADA99E}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #2D2D2A; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif">
  <header style="padding: 56px 20px 0">
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <div>
        <h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 32px; letter-spacing: -0.02em">Songs</h1>
        <p style="margin: 4px 0 0; font-size: 14px; color: #D9D5CA">214 songs · 32 only on this phone</p>
      </div>
      <a href="AddSongs.dc.html" aria-label="Add songs" style="width: 48px; height: 48px; border-radius: 16px; background: #F26419; color: #161615; display: flex; align-items: center; justify-content: center; flex: none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 2.4"><path d="M12 5v14M5 12h14"></path></svg></a>
    </div>
    <div style="margin-top: 14px; position: relative">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 14px; top: 13px; width: 20px; height: 20px; color: #CCC8BC"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search songs</label>
      <input class="search" id="q" type="search" placeholder="Search songs">
    </div>
    <div style="margin-top: 10px; display: flex; gap: 8px">
      <a href="SyncCloud.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; border-radius: 14px; background: #4C4C47; color: #FFFFFF; text-decoration: none">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: #E5DCC5"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path><path d="m9 14 2 2 4-4"></path></svg>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><strong style="font-size: 13px; font-weight: 600">Library syncs automatically</strong><span style="font-size: 12px; color: #CCC8BC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">2 syncing · 1 queued</span></span>
      </a>
      <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 12px; border-radius: 14px; border: 0; background: #E5DCC5; color: #161615; font: 700 13px 'Instrument Sans', sans-serif; cursor: pointer; flex: none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.4"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path><path d="M3 21v-5h5"></path><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path></svg>Retry failed syncs</button>
    </div>
  </header>

  <ol aria-label="All songs, library order" style="list-style: none; margin: 14px 0 0; padding: 0 12px 200px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{songs}}" as="s" hint-placeholder-count="7">
      <li><dc-import name="SongRow" item="{{s}}" hint-size="100%,64px"></dc-import></li>
    </sc-for>
  </ol>

  <div style="position: absolute; left: 0; right: 0; bottom: 0">
    <dc-import name="MiniPlayer" hint-size="390px,80px"></dc-import>
    <dc-import name="TabBar" active="songs" hint-size="390px,88px"></dc-import>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      songs: [
        { name: 'Harbor Lights', artist: 'Marina Okafor', dur: '3:52', status: 'synced', playing: true },
        { name: 'Rehearsal take 3', artist: '', dur: '2:41', status: 'local' },
        { name: 'Night Market', artist: 'Ines Caldera', dur: '3:18', status: 'syncing', pct: 42 },
        { name: 'Undertow', artist: 'Marina Okafor', dur: '5:02', status: 'relink' },
        { name: 'Late Train to Lisbon', artist: 'Paulo Verde', dur: '3:29', status: 'failed' },
        { name: 'Saltwater Hymn', artist: 'Juniper Hall', dur: '4:45', status: 'queued' },
        { name: 'Copper Sky', artist: 'The Low Tides', dur: '4:07', status: 'synced' },
        { name: 'Glass Garden', artist: 'Northbound Static', dur: '3:11', status: 'changed' }
      ]
    };
  }
}
</script>
</body>
</html>
