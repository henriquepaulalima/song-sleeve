<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add songs to playlist</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
.search{width:100%;box-sizing:border-box;min-height:48px;padding:0 14px 0 42px;border-radius:14px;border:1.5px solid rgba(255,255,255,.16);background:#3A3A36;color:#FFFFFF;font:400 16px 'Instrument Sans',sans-serif}
.search::placeholder{color:#ADA99E}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:0 10px;border:0;border-radius:12px;background:transparent;color:#FFFFFF;font-family:'Instrument Sans',sans-serif;text-align:left;cursor:pointer}
.opt:disabled{cursor:default}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2D2D2A; font-family: 'Instrument Sans', sans-serif; color: #FFFFFF">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(22,22,21,.72)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="t" style="position: absolute; left: 0; right: 0; top: 44px; bottom: 0; background: #4C4C47; border-radius: 28px 28px 0 0; padding: 10px 16px 30px; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 5px; background: rgba(255,255,255,.3); margin: 0 auto"></div>
    <div style="display: flex; align-items: flex-start; justify-content: space-between; margin-top: 12px">
      <div><h1 id="t" style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Add songs to playlist</h1><p style="margin: 4px 0 0; font-size: 14px; color: #CCC8BC">Sunday Drive</p></div>
      <a href="Playlist.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #3A3A36; color: #FFFFFF; flex: none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
    </div>
    <div style="margin-top: 14px; position: relative">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 14px; top: 14px; width: 20px; height: 20px; color: #CCC8BC"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search songs</label>
      <input class="search" id="q" type="search" placeholder="Search songs" value="{{q}}" onChange="{{onQ}}">
    </div>
    <ul aria-label="Songs" style="list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; overflow: auto; flex: 1">
      <sc-for list="{{songs}}" as="s" hint-placeholder-count="7">
        <li><button class="opt" type="button" role="checkbox" aria-checked="{{s.checked}}" aria-disabled="{{s.inList}}" disabled="{{s.inListB}}" onClick="{{s.toggle}}">
          <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 9px; background: #3A3A36; color: #E5DCC5; display: flex; align-items: center; justify-content: center; flex: none"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600; color: {{s.fg}}">{{s.name}}</span><span style="font-size: 12px; color: #CCC8BC">{{s.sub}}</span></span>
          <sc-if value="{{s.inListB}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #CCC8BC">In playlist</span></sc-if>
          <sc-if value="{{s.canPick}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{s.boxBg}}; box-shadow: {{s.boxRing}}; color: #161615"><sc-if value="{{s.on}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke-width: 3"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span></sc-if>
        </button></li>
      </sc-for>
      <sc-if value="{{none}}" hint-placeholder-val="{{ false }}"><li style="padding: 24px 8px; text-align: center; color: #CCC8BC; font-size: 14px">No results for “{{q}}”</li></sc-if>
    </ul>
    <div style="padding-top: 12px; display: flex; flex-direction: column; gap: 8px">
      <a href="Playlist.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: #F26419; color: #161615; font-size: 16px; font-weight: 700; text-decoration: none">{{addLabel}}</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', picked: { 'Night Market': true, 'Driftwood': true } };
  }
  renderVals() {
    const st = this.state;
    const all = [
      { name: 'Harbor Lights', sub: 'Marina Okafor', inList: true },
      { name: 'Night Market', sub: 'Ines Caldera' },
      { name: 'Driftwood', sub: 'The Low Tides · on this phone only' },
      { name: 'Undertow', sub: 'Marina Okafor' },
      { name: 'Copper Sky', sub: 'The Low Tides', inList: true },
      { name: 'Late Train to Lisbon', sub: 'Paulo Verde' },
      { name: 'Lanterns', sub: 'Ines Caldera' },
      { name: 'Two Rivers', sub: 'Ines Caldera' }
    ];
    const q = st.q.trim().toLowerCase();
    const list = all.filter((s) => !q || (s.name + ' ' + s.sub).toLowerCase().includes(q));
    const n = Object.values(st.picked).filter(Boolean).length;
    return {
      q: st.q,
      onQ: (e) => this.setState({ q: e.target.value }),
      none: list.length === 0,
      addLabel: n ? 'Add ' + n + (n === 1 ? ' song' : ' songs') : 'Add',
      songs: list.map((s) => {
        const on = !!st.picked[s.name];
        return {
          ...s, on,
          inList: s.inList ? 'true' : 'false',
          inListB: !!s.inList,
          canPick: !s.inList,
          fg: s.inList ? '#ADA99E' : '#FFFFFF',
          checked: s.inList ? 'true' : (on ? 'true' : 'false'),
          boxBg: on ? '#E5DCC5' : 'transparent',
          boxRing: on ? 'none' : 'inset 0 0 0 2px #CCC8BC',
          toggle: () => this.setState({ picked: { ...this.state.picked, [s.name]: !on } })
        };
      })
    };
  }
}
</script>
</body>
</html>
