<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:16px;font:600 16px 'Instrument Sans',sans-serif;text-decoration:none}
.btn:focus-visible,.lang:focus-visible{outline:3px solid #E5DCC5;outline-offset:3px}
.lang{min-height:36px;padding:0 12px;border:0;border-radius:10px;font:600 13px 'Instrument Sans',sans-serif;cursor:pointer}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #2D2D2A; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; padding: 48px 24px 40px">
  <div role="group" aria-label="Language" style="align-self: flex-end; display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 13px; background: #3A3A36">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; margin: 0 4px 0 6px; color: #CCC8BC"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path><path d="M12 3a14 14 0 0 1 0 18"></path><path d="M12 3a14 14 0 0 0 0 18"></path></svg>
    <button class="lang" type="button" aria-pressed="{{enP}}" onClick="{{toEn}}" style="background: {{enBg}}; color: {{enFg}}">English</button>
    <button class="lang" type="button" lang="pt-BR" aria-pressed="{{ptP}}" onClick="{{toPt}}" style="background: {{ptBg}}; color: {{ptFg}}">Português (Brasil)</button>
  </div>

  <div style="position: relative; height: 300px; margin-top: 18px">
    <div aria-hidden="true" style="position: absolute; left: 112px; top: 30px; width: 226px; height: 226px; border-radius: 50%; background: repeating-radial-gradient(circle at center, #161615 0 2px, #222220 2px 4px); box-shadow: 0 24px 40px -16px rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center">
      <div style="width: 82px; height: 82px; border-radius: 50%; background: #F26419; display: flex; align-items: center; justify-content: center"><div style="width: 12px; height: 12px; border-radius: 50%; background: #161615"></div></div>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 8px; top: 16px; width: 242px; height: 256px; border-radius: 14px; background: #4C4C47; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 30px 50px -20px rgba(0,0,0,.75); transform: rotate(-4deg); display: flex; align-items: center; justify-content: center">
      <div style="position: absolute; inset: 14px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12)"></div>
      <div style="width: 80px; height: 80px; border-radius: 50%; background: #3A3A36; color: #E5DCC5; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 38px; height: 38px"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></div>
      <div style="position: absolute; left: 28px; bottom: 26px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .14em; color: #CCC8BC">SIDE A · YOUR LIBRARY</div>
    </div>
  </div>

  <div style="margin-top: 30px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -0.02em">Song Sleeve</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #EDEAE2; max-width: 330px">{{tagline}}</p>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <a class="btn" href="Login.dc.html" style="background: #F26419; color: #161615">{{login}}</a>
    <a class="btn" href="Register.dc.html" style="color: #FFFFFF; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.7)">{{register}}</a>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'en' };
  }
  renderVals() {
    const pt = this.state.lang === 'pt';
    const on = { bg: '#E5DCC5', fg: '#161615' };
    const off = { bg: 'transparent', fg: '#FFFFFF' };
    return {
      enBg: pt ? off.bg : on.bg, enFg: pt ? off.fg : on.fg, enP: pt ? 'false' : 'true',
      ptBg: pt ? on.bg : off.bg, ptFg: pt ? on.fg : off.fg, ptP: pt ? 'true' : 'false',
      toEn: () => this.setState({ lang: 'en' }),
      toPt: () => this.setState({ lang: 'pt' }),
      tagline: pt ? 'Toque e organize as músicas que são suas. Os arquivos ficam onde estão no seu aparelho.' : 'Play and organize the music files you own. They stay right where they are on your device.',
      login: pt ? 'Entrar' : 'Log in',
      register: pt ? 'Criar conta' : 'Register'
    };
  }
}
</script>
</body>
</html>
