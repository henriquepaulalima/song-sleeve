<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Songs · desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#2D2D2A}
dc-import{display:block;width:100%}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
.search{width:100%;box-sizing:border-box;min-height:46px;padding:0 14px 0 42px;border-radius:14px;border:0;background:#4C4C47;color:#FFFFFF;font:400 15px 'Instrument Sans',sans-serif}
.search::placeholder{color:#ADA99E}
.th{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#D9D5CA}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #2D2D2A; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif">
  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">
    <div style="flex: 1 1 240px; max-width: 100%; display: flex; background: #4C4C47; box-shadow: 1px 0 0 rgba(255,255,255,.06)"><dc-import name="WebSidebar" active="songs" hint-size="100%,900px"></dc-import></div>
    <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px) 40px">
      <div style="max-width: 1120px; margin: 0 auto">
        <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
          <div>
            <h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 40px; letter-spacing: -0.02em">Songs</h1>
            <p style="margin: 4px 0 0; font-size: 15px; color: #D9D5CA">214 songs · 32 only on this computer</p>
          </div>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
            <a href="WebSyncCloud.dc.html" style="display: flex; align-items: center; gap: 12px; min-width: 250px; padding: 8px 14px; border-radius: 14px; background: #4C4C47; color: #FFFFFF; text-decoration: none">
              <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px; color: #E5DCC5"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path><path d="m9 14 2 2 4-4"></path></svg>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 13px; font-weight: 600">Library syncs automatically</strong><span style="font-size: 12px; color: #CCC8BC">2 syncing · 1 queued · 1 failed</span></span>
            </a>
            <button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 14px; border-radius: 14px; border: 0; background: #E5DCC5; color: #161615; font: 700 14px 'Instrument Sans', sans-serif; cursor: pointer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.4"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path><path d="M3 21v-5h5"></path><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path></svg>Retry failed syncs</button>
            <a href="WebAddSongs.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px 0 14px; border-radius: 14px; background: #F26419; color: #161615; font-weight: 700; font-size: 15px; text-decoration: none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; stroke-width: 2.4"><path d="M12 5v14M5 12h14"></path></svg>Add songs</a>
          </div>
        </header>
        <div style="margin-top: 20px; position: relative; max-width: 420px">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 14px; top: 13px; width: 20px; height: 20px; color: #CCC8BC"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search songs</label>
          <input class="search" id="q" type="search" placeholder="Search songs">
        </div>

        <div style="margin-top: 18px; overflow-x: auto">
          <div style="min-width: 820px; display: flex; flex-direction: column; gap: 6px">
            <div aria-hidden="true" style="display: grid; grid-template-columns: 44px minmax(0,2.2fr) minmax(0,1.3fr) 230px 56px 44px; column-gap: 12px; padding: 0 6px 4px"><span></span><span class="th">TITLE</span><span class="th">ARTIST</span><span class="th">STATUS</span><span class="th" style="text-align: right">TIME</span><span></span></div>
            <ol aria-label="All songs, library order" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
              <sc-for list="{{songs}}" as="s" hint-placeholder-count="9">
                <li><dc-import name="WebSongRow" item="{{s}}" hint-size="100%,60px"></dc-import></li>
              </sc-for>
            </ol>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div style="position: sticky; bottom: 0; z-index: 5; background: #4C4C47; box-shadow: 0 -16px 30px -16px rgba(0,0,0,.6)"><dc-import name="WebPlayer" hint-size="100%,84px"></dc-import></div>
</div>
</x-dc>

        { name: 'Morning Ferry', artist: 'The Low Tides', dur: '3:58', status: 'synced' }
      ]
    };
  }
}
</script>
</body>
</html>
