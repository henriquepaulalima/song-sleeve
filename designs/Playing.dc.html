<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.f{fill:currentColor;stroke:none}
.rb{width:48px;height:48px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;background:#2D2D2A;color:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 16px -8px rgba(0,0,0,.7);text-decoration:none;cursor:pointer}
.db{position:absolute;width:52px;height:52px;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.db:disabled,.play:disabled{cursor:not-allowed}
.play{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #E5DCC5;outline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:600}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #4C4C47; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; padding: 52px 24px 30px">
  <header style="display: flex; align-items: center; justify-content: space-between">
    <a class="rb" href="Songs.dc.html" aria-label="Close player">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </a>
    <div style="text-align: center">
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #CCC8BC">PLAYING FROM</div>
      <div style="font-size: 15px; font-weight: 600; margin-top: 2px">{{source}}</div>
    </div>
    <a class="rb" href="SongMenu.dc.html" aria-label="Song actions">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle class="f" cx="5" cy="12" r="1.7"></circle><circle class="f" cx="12" cy="12" r="1.7"></circle><circle class="f" cx="19" cy="12" r="1.7"></circle></svg>
    </a>
  </header>

  <div style="margin: 22px auto 0; width: 240px; height: 240px; border-radius: 20px; background: #2D2D2A; color: {{coverIcon}}; position: relative; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 34px 50px -24px rgba(0,0,0,.85)" role="img" aria-label="Cover placeholder">
    <span style="position: absolute; inset: 16px; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14)"></span>
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 64px; height: 64px; stroke-width: 1.6"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
  </div>

  <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 26px; letter-spacing: -0.015em">{{title}}</h1>
    <sc-if value="{{hasSong}}" hint-placeholder-val="{{ true }}">
      <a href="Artist.dc.html" style="align-self: flex-start; font-size: 16px; color: #D9D5CA; text-decoration: underline; text-decoration-color: rgba(217,213,202,.35); text-underline-offset: 4px">Marina Okafor</a>
    </sc-if>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; font-size: 15px; color: #CCC8BC">Choose a song from your library to start playing.</p>
    </sc-if>
  </div>

  <div style="margin-top: 16px">
    <sc-if value="{{loading}}" hint-placeholder-val="{{ false }}">
      <p role="status" style="margin: 0 0 12px; display: flex; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #3A3A36; font-size: 13px; line-height: 1.4; color: #EDEAE2"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; margin-top: 1px; color: #E5DCC5"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>This song was updated. Changes will be applied after playback finishes.</p>
    </sc-if>
    <sc-if value="{{showSeek}}" hint-placeholder-val="{{ true }}">
      <label for="seek" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Seek</label>
      <div style="position: relative; height: 22px; display: flex; align-items: center">
        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; height: 6px; border-radius: 6px; background: #252522"></div>
        <div aria-hidden="true" style="position: absolute; left: 0; width: {{pct}}; height: 6px; border-radius: 6px; background: #E5DCC5"></div>
        <div aria-hidden="true" style="position: absolute; left: {{pct}}; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 0 4px rgba(229,220,197,.35), 0 3px 6px rgba(0,0,0,.5)"></div>
        <input id="seek" type="range" min="0" max="232" value="84" disabled="{{seekDisabled}}" style="position: absolute; inset: 0; width: 100%; opacity: 0; margin: 0; cursor: pointer">
      </div>
      <div style="display: flex; justify-content: space-between; margin-top: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #D9D5CA">
        <span>{{elapsed}}</span><span>{{total}}</span>
      </div>
    </sc-if>
  </div>

  <div style="margin: auto auto 0; position: relative; width: 230px; height: 230px; border-radius: 50%; background: #3A3A36; box-shadow: inset 0 6px 14px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.07), 0 1px 0 rgba(255,255,255,.06)">
    <button class="db" type="button" onClick="{{toggleShuffle}}" aria-pressed="{{shufflePressed}}" aria-label="Shuffle" disabled="{{off}}" style="left: 89px; top: 8px; color: {{shuffleColor}}">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20 21 3"></path><path d="M21 16v5h-5"></path><path d="m15 15 6 6"></path><path d="M4 4l5 5"></path></svg>
    </button>
    <button class="db" type="button" aria-label="Previous song" disabled="{{off}}" style="left: 10px; top: 89px; color: {{ctrlColor}}">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px"><path class="f" d="M19 20 9 12l10-8v16z"></path><path d="M5 19V5" style="stroke-width: 2.4"></path></svg>
    </button>
    <button class="db" type="button" aria-label="Next song" disabled="{{off}}" style="right: 10px; top: 89px; color: {{ctrlColor}}">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px"><path class="f" d="m5 4 10 8-10 8V4z"></path><path d="M19 5v14" style="stroke-width: 2.4"></path></svg>
    </button>
    <button class="db" type="button" onClick="{{toggleRepeat}}" aria-pressed="{{repeatPressed}}" aria-label="Repeat current song" disabled="{{off}}" style="left: 89px; bottom: 8px; color: {{repeatColor}}">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path><path d="M11 10h1v4"></path></svg>
    </button>
    <button class="play" type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" disabled="{{off}}" style="background: {{playBg}}; color: {{playFg}}; box-shadow: inset 0 2px 0 rgba(255,255,255,.25), 0 14px 24px -10px rgba(0,0,0,.8)">
      <sc-if value="{{showPause}}" hint-placeholder-val="{{ true }}">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 34px; height: 34px"><rect class="f" x="6" y="4" width="4" height="16" rx="1"></rect><rect class="f" x="14" y="4" width="4" height="16" rx="1"></rect></svg>
      </sc-if>
      <sc-if value="{{showPlay}}" hint-placeholder-val="{{ false }}">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 34px; height: 34px; margin-left: 4px"><path class="f" d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"></path></svg>
      </sc-if>
    </button>
  </div>

  <div style="margin-top: 16px; display: flex; justify-content: center; gap: 8px">
    <span class="pill" style="background: {{shufflePillBg}}; color: {{shufflePillFg}}">Shuffle {{shuffleText}}</span>
    <span class="pill" style="background: {{repeatPillBg}}; color: {{repeatPillFg}}">Repeat song {{repeatText}}</span>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["ready","updated","empty"],"default":"ready"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true, shuffle: true, repeat: false };
  }
  renderVals() {
    const v = this.props.variant ?? 'ready';
    const empty = v === 'empty';
    const loading = v === 'updated';
    const off = empty;
    const st = this.state;
    const sh = st.shuffle && !off;
    const rp = st.repeat && !off;
    const onPill = (on) => ({ bg: on ? '#E5DCC5' : '#3A3A36', fg: on ? '#161615' : '#CCC8BC' });
    const shP = onPill(sh);
    const rpP = onPill(rp);
    const playing = st.playing && v !== 'empty';
    return {
      source: empty ? 'Nothing queued' : 'Sunday Drive',
      title: empty ? 'Nothing playing' : 'Harbor Lights',
      hasSong: !empty,
      empty,
      loading,
      showSeek: true,
      seekDisabled: empty,
      pct: empty ? '0%' : '36%',
      elapsed: empty ? '0:00' : '1:24',
      total: empty ? '--:--' : '3:52',
      coverIcon: empty ? '#8E8B82' : '#E5DCC5',
      off,
      ctrlColor: off ? '#75736C' : '#FFFFFF',
      shuffleColor: off ? '#75736C' : (sh ? '#E5DCC5' : '#FFFFFF'),
      repeatColor: off ? '#75736C' : (rp ? '#E5DCC5' : '#FFFFFF'),
      shufflePressed: sh ? 'true' : 'false',
      repeatPressed: rp ? 'true' : 'false',
      shuffleText: sh ? 'on' : 'off',
      repeatText: rp ? 'on' : 'off',
      shufflePillBg: shP.bg, shufflePillFg: shP.fg,
      repeatPillBg: rpP.bg, repeatPillFg: rpP.fg,
      playBg: off ? '#5A5A54' : '#F26419',
      playFg: off ? '#8E8B82' : '#161615',
      showPause: playing,
      showPlay: !playing,
      playLabel: playing ? 'Pause' : 'Play',
      togglePlay: () => this.setState({ playing: !this.state.playing }),
      toggleShuffle: () => this.setState({ shuffle: !this.state.shuffle }),
      toggleRepeat: () => this.setState({ repeat: !this.state.repeat })
    };
  }
}
</script>
</body>
</html>
