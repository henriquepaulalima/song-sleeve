<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit song</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a:focus-visible,button:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
.lbl{font-size:13px;font-weight:600;color:#EDEAE2}
.in{width:100%;box-sizing:border-box;min-height:52px;padding:0 14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.18);background:#3A3A36;color:#FFFFFF;font:400 16px 'Instrument Sans',sans-serif;outline:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:#FFFFFF;font:500 15px 'Instrument Sans',sans-serif;text-align:left;cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:#4C4C47;color:#E5DCC5;font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:800;font-size:13px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2D2D2A; font-family: 'Instrument Sans', sans-serif; color: #FFFFFF">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(22,22,21,.72)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="t" style="position: absolute; left: 0; right: 0; top: 110px; bottom: 0; background: #4C4C47; border-radius: 28px 28px 0 0; padding: 10px 16px 30px; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 5px; background: rgba(255,255,255,.3); margin: 0 auto"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 12px">
      <h1 id="t" style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 26px; letter-spacing: -0.02em">Edit song</h1>
      <a href="Songs.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #3A3A36; color: #FFFFFF"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
    </div>

    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 6px">
      <label class="lbl" for="nm">Name</label>
      <input class="in" id="nm" type="text" value="Undertow" readonly maxlength="200">
    </div>

    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <label class="lbl" for="ar">Artist <span style="font-weight: 400; color: #CCC8BC">(optional)</span></label>
        <button type="button" onClick="{{clear}}" style="min-height: 32px; padding: 0 4px; border: 0; background: none; color: #FFFFFF; font: 600 13px 'Instrument Sans', sans-serif; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Clear</button>
      </div>
      <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
        <div class="in" style="display: flex; align-items: center; gap: 10px; border-color: #E5DCC5; box-shadow: 0 0 0 3px rgba(229,220,197,.2)">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: #CCC8BC"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="ar" type="text" role="combobox" aria-expanded="true" aria-controls="lb" value="Marina Okafr" readonly style="flex: 1; min-width: 0; border: 0; background: transparent; color: #FFFFFF; font: 400 16px 'Instrument Sans', sans-serif; outline: none">
        </div>
        <div role="status" style="margin-top: 4px; padding: 10px 12px; border-radius: 12px; background: #E5DCC5; color: #161615; font-size: 14px">Did you mean <strong>Marina Okafor</strong>?</div>
        <ul id="lb" role="listbox" aria-label="Artists" style="list-style: none; margin: 4px 0 0; padding: 6px; border-radius: 16px; background: #3A3A36">
          <li role="option" aria-selected="false"><button class="opt" type="button" onClick="{{pickMarina}}"><span class="av" aria-hidden="true">M</span><span style="flex: 1">Marina Okafor</span><span style="font-size: 12px; color: #CCC8BC">6 songs</span></button></li>
          <li role="option" aria-selected="false"><button class="opt" type="button" onClick="{{pickTrio}}"><span class="av" aria-hidden="true">M</span><span style="flex: 1">Marigold Trio</span><span style="font-size: 12px; color: #CCC8BC">3 songs</span></button></li>
          <li aria-hidden="true" style="height: 1px; margin: 4px 8px; background: rgba(255,255,255,.08)"></li>
          <li role="option" aria-selected="false"><button class="opt" type="button" onClick="{{pickNew}}"><span class="av" aria-hidden="true" style="background: #E5DCC5; color: #161615"><svg class="i" viewBox="0 0 24 24" style="width: 15px; height: 15px; stroke-width: 2.6"><path d="M12 5v14M5 12h14"></path></svg></span><span style="flex: 1">New artist “Marina Okafr”</span></button></li>
        </ul>
      </sc-if>
      <sc-if value="{{closed}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{reopen}}" class="in" style="display: flex; align-items: center; gap: 10px; text-align: left; cursor: pointer">
          <sc-if value="{{hasPick}}" hint-placeholder-val="{{ true }}"><span style="padding: 5px 12px; border-radius: 999px; background: #E5DCC5; color: #161615; font-size: 14px; font-weight: 600">{{pick}}</span><span style="font-size: 12px; color: #CCC8BC">{{note}}</span></sc-if>
          <sc-if value="{{noPick}}" hint-placeholder-val="{{ false }}"><span style="color: #ADA99E">No artist</span></sc-if>
        </button>
      </sc-if>
    </div>

    <sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
      <p role="alert" style="margin: 14px 0 0; display: flex; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #E5DCC5; color: #161615; font-size: 13px; line-height: 1.4; font-weight: 600"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.4; margin-top: 1px"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path><path d="M12 9v4"></path></svg>Connect to the server to make changes. This change was not saved.</p>
    </sc-if>
    <p style="margin: 14px 0 0; font-size: 13px; line-height: 1.45; color: #CCC8BC">This song is synced, so saving needs a connection. Your other devices show the change right after.</p>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <a href="Songs.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: #F26419; color: #161615; font-size: 16px; font-weight: 700; text-decoration: none">Save</a>
      <a href="Songs.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none">Cancel</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"network":{"editor":"enum","options":["online","offline"],"default":"online"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true, pick: null, note: '' };
  }
  renderVals() {
    const st = this.state;
    const set = (pick, note) => () => this.setState({ open: false, pick, note });
    return {
      open: st.open, closed: !st.open,
      hasPick: !!st.pick, noPick: !st.pick,
      pick: st.pick, note: st.note,
      pickMarina: set('Marina Okafor', 'In your library'),
      pickTrio: set('Marigold Trio', 'In your library'),
      pickNew: set('Marina Okafr', 'New artist · created when you save'),
      clear: () => this.setState({ open: false, pick: null, note: '' }),
      reopen: () => this.setState({ open: true }),
      offline: (this.props.network ?? 'online') === 'offline'
    };
  }
}
</script>
</body>
</html>
