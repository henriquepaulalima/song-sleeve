<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library · desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#2D2D2A}
dc-import{display:block;width:100%}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a:focus-visible,button:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 16px;border-radius:999px;border:0;font:600 14px 'Instrument Sans',sans-serif;cursor:pointer}
.card{display:flex;flex-direction:column;gap:12px;padding:12px;border-radius:18px;background:#4C4C47;color:#FFFFFF;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 14px 24px -16px rgba(0,0,0,.75)}
.card:hover{background:#56564F}
.vis{position:relative;aspect-ratio:4 / 3;border-radius:12px}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #2D2D2A; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif">
  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">
    <div style="flex: 1 1 240px; max-width: 100%; display: flex; background: #4C4C47; box-shadow: 1px 0 0 rgba(255,255,255,.06)"><dc-import name="WebSidebar" active="library" hint-size="100%,900px"></dc-import></div>

    <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px) 48px">
      <div style="max-width: 1120px; margin: 0 auto">
        <header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
          <div>
            <h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 40px; letter-spacing: -0.02em">Library</h1>
            <p style="margin: 6px 0 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #D9D5CA"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 15px; height: 15px"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path><path d="m9 14 2 2 4-4"></path></svg>Filter saved to your account · same view on every device</p>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <a href="WebCollectionDialogs.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 12px; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 5v14M5 12h14"></path></svg>Create playlist</a>
            <a href="WebCollectionDialogs.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 14px; border-radius: 12px; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 5v14M5 12h14"></path></svg>Create group</a>
          </div>
          <div role="group" aria-label="Show item types" style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
              <button class="chip" type="button" aria-pressed="{{c.pressed}}" onClick="{{c.toggle}}" style="background: {{c.bg}}; color: {{c.fg}}; box-shadow: {{c.ring}}">
                <sc-if value="{{c.on}}" hint-placeholder-val="{{ true }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; stroke-width: 2.6"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
                {{c.label}}<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; opacity: .8">{{c.count}}</span>
              </button>
            </sc-for>
          </div>
        </header>
        <div style="margin-top: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
          <div style="position: relative; flex: 1 1 320px; max-width: 460px">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="position: absolute; left: 14px; top: 13px; width: 20px; height: 20px; color: #CCC8BC"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
            <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search library</label>
            <input id="q" type="search" placeholder="Search songs, playlists and groups" style="width: 100%; box-sizing: border-box; min-height: 46px; padding: 0 14px 0 42px; border-radius: 14px; border: 0; background: #4C4C47; color: #FFFFFF; font: 400 15px 'Instrument Sans', sans-serif">
          </div>
        </div>

        <sc-if value="{{noneOn}}" hint-placeholder-val="{{ false }}">
          <div style="margin-top: 80px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 40px; height: 40px; color: #E5DCC5"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
            <p style="margin: 0; font-size: 18px; font-weight: 600">Nothing selected</p>
            <p style="margin: 0; font-size: 14px; color: #D9D5CA">Turn on Songs, Playlists or Groups to see them here.</p>
          </div>
        </sc-if>

        <div style="margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px">
          <sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
            <a class="card" href="{{c.href}}">
              <sc-if value="{{c.isSong}}" hint-placeholder-val="{{ true }}">
                <span class="vis" style="background: #3A3A36; color: #E5DCC5; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08)">
                  <span style="position: absolute; inset: 9px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08)"></span>
                  <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 38px; height: 38px; stroke-width: 1.8"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                </span>
              </sc-if>
              <sc-if value="{{c.isPlaylist}}" hint-placeholder-val="{{ false }}">
                <span class="vis" aria-hidden="true">
                  <span style="position: absolute; left: 14%; right: 0; top: 0; bottom: 14%; border-radius: 12px; background: #5E5E58"></span>
                  <span style="position: absolute; left: 0; right: 14%; top: 14%; bottom: 0; border-radius: 12px; background: #3A3A36; color: #E5DCC5; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 -6px 14px -6px rgba(0,0,0,.6)">
                    <svg class="i" viewBox="0 0 24 24" style="width: 34px; height: 34px"><path d="M21 15V6"></path><circle cx="18.5" cy="15.5" r="2.5"></circle><path d="M12 12H3"></path><path d="M16 6H3"></path><path d="M12 18H3"></path></svg>
                  </span>
                </span>
              </sc-if>
              <sc-if value="{{c.isGroup}}" hint-placeholder-val="{{ false }}">
                <span class="vis" aria-hidden="true" style="display: flex; align-items: center; justify-content: center">
                  <span style="position: relative; width: 120px; height: 120px">
                    <span style="position: absolute; left: 22px; top: -4px; width: 96px; height: 96px; border-radius: 12px; background: #6E6E67; transform: rotate(12deg)"></span>
                    <span style="position: absolute; left: 12px; top: 6px; width: 96px; height: 96px; border-radius: 12px; background: #5E5E58; transform: rotate(5deg)"></span>
                    <span style="position: absolute; left: 0; top: 20px; width: 100px; height: 100px; border-radius: 12px; background: #3A3A36; color: #E5DCC5; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 10px 18px -8px rgba(0,0,0,.6)"><svg class="i" viewBox="0 0 24 24" style="width: 32px; height: 32px"><path d="m12 2 10 5-10 5L2 7z"></path><path d="m2 17 10 5 10-5"></path><path d="m2 12 10 5 10-5"></path></svg></span>
                  </span>
                </span>
              </sc-if>
              <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0; padding: 0 4px 4px">
                <span style="font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
                <span style="font-size: 13px; color: #CCC8BC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><strong style="font-weight: 700; color: #FFFFFF; letter-spacing: .04em; font-size: 11px; text-transform: uppercase">{{c.kind}}</strong> · {{c.meta}}</span>
              </span>
            </a>
          </sc-for>
        </div>
      </div>
    </main>
  </div>
  <div style="position: sticky; bottom: 0; z-index: 5; background: #4C4C47; box-shadow: 0 -16px 30px -16px rgba(0,0,0,.6)"><dc-import name="WebPlayer" hint-size="100%,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1020}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { song: true, playlist: true, group: true };
  }
  renderVals() {
    const st = this.state;
    const all = [
      { type: 'group', name: 'Travel', meta: '3 playlists', href: 'WebGroup.dc.html' },
      { type: 'playlist', name: 'Sunday Drive', meta: '14 songs', href: 'WebPlaylist.dc.html' },
      { type: 'song', name: 'Harbor Lights', meta: 'Marina Okafor', href: 'WebPlaying.dc.html' },
      { type: 'song', name: 'Copper Sky', meta: 'The Low Tides', href: 'WebPlaying.dc.html' },
      { type: 'playlist', name: 'Late Night', meta: '22 songs', href: 'WebPlaylist.dc.html' },
      { type: 'group', name: 'Moods', meta: '4 playlists', href: 'WebGroup.dc.html' },
      { type: 'song', name: 'Night Market', meta: 'Ines Caldera', href: 'WebPlaying.dc.html' },
      { type: 'playlist', name: 'Focus', meta: '31 songs', href: 'WebPlaylist.dc.html' },
      { type: 'song', name: 'Rehearsal take 3', meta: 'No artist', href: 'WebPlaying.dc.html' },
      { type: 'group', name: 'Work', meta: '2 playlists', href: 'WebGroup.dc.html' },
      { type: 'playlist', name: 'Kitchen Radio', meta: '18 songs', href: 'WebPlaylist.dc.html' },
      { type: 'song', name: 'Saltwater Hymn', meta: 'Juniper Hall', href: 'WebPlaying.dc.html' }
    ];
    const kinds = { song: 'Song', playlist: 'Playlist', group: 'Group' };
    const cards = all.filter((c) => st[c.type]).map((c) => ({
      ...c,
      kind: kinds[c.type],
      isSong: c.type === 'song',
      isPlaylist: c.type === 'playlist',
      isGroup: c.type === 'group'
    }));
    const chip = (key, label, count) => {
      const on = st[key];
      return {
        label, count, on,
        pressed: on ? 'true' : 'false',
        bg: on ? '#E5DCC5' : 'transparent',
        fg: on ? '#161615' : '#FFFFFF',
        ring: on ? 'none' : 'inset 0 0 0 1.5px rgba(255,255,255,.55)',
        toggle: () => { const n = ['song','playlist','group'].filter((k) => this.state[k]).length; if (on && n === 1) return; this.setState({ [key]: !this.state[key] }); }
      };
    };
    return {
      chips: [chip('song', 'Songs', '214'), chip('playlist', 'Playlists', '12'), chip('group', 'Groups', '3')],
      cards,
      noneOn: !st.song && !st.playlist && !st.group
    };
  }
}
</script>
</body>
</html>
