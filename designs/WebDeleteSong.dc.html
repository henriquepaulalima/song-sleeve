<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Delete song · desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#2D2D2A}
dc-import{display:block;width:100%}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a:focus-visible,button:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #2D2D2A; font-family: 'Instrument Sans', sans-serif; color: #FFFFFF">
  <div aria-hidden="true" style="position: absolute; inset: 0"><dc-import name="WebSongs" hint-size="1440px,900px"></dc-import></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(22,22,21,.78)"></div>
  <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center">
    <section role="alertdialog" aria-modal="true" aria-labelledby="t" aria-describedby="d" style="width: 540px; box-sizing: border-box; padding: 30px; border-radius: 28px; background: #4C4C47; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 50px 80px -24px rgba(0,0,0,.95)">
      <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 18px; background: #F26419; color: #161615; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 26px; height: 26px"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg></span>
      <span style="margin-top: 16px; display: inline-flex; padding: 3px 9px; border-radius: 7px; font-size: 12px; font-weight: 700; background: {{bBg}}; color: {{bFg}}; box-shadow: {{bRing}}">{{badge}}</span>
      <h1 id="t" style="margin: 10px 0 0; font-family: 'Archivo', sans-serif; font-stretch: 112%; font-weight: 800; font-size: 26px; line-height: 1.2; letter-spacing: -0.015em">{{title}}</h1>
      <p id="d" style="margin: 12px 0 0; font-size: 16px; line-height: 1.5; color: #EDEAE2">{{body}}</p>
      <p style="margin: 10px 0 0; font-size: 13px; color: #CCC8BC">{{foot}}</p>
      <div style="margin-top: 26px; display: flex; justify-content: flex-end; gap: 10px">
        <a href="WebSongs.dc.html" style="display: flex; align-items: center; min-height: 52px; padding: 0 22px; border-radius: 16px; color: #FFFFFF; font-weight: 600; text-decoration: none; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.4)">Cancel</a>
        <a href="WebSongs.dc.html" style="display: flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 16px; background: #F26419; color: #161615; font-size: 16px; font-weight: 700; text-decoration: none">Delete song</a>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"song":{"editor":"enum","options":["local","synced","syncing"],"default":"synced"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.song ?? 'synced';
    const T = {
      local: { badge: 'On this device', k: ['transparent', '#EDEAE2', 'inset 0 0 0 1px rgba(255,255,255,.35)'], title: 'Delete “Rehearsal take 3” from this device?', body: 'It will be removed from your library and playlists on this device. The file stays where it is.', foot: 'Works offline.' },
      synced: { badge: 'Synced', k: ['#3A3A36', '#D9D5CA', 'none'], title: 'Delete “Undertow” from your account?', body: 'It will be removed from the cloud, from every device, and from all playlists.', foot: 'Needs a connection. Files outside the Song Sleeve folder are never touched.' },
      syncing: { badge: 'Syncing… 42%', k: ['#3A3A36', '#E5DCC5', 'none'], title: 'Delete “Night Market”?', body: 'Its sync stops and it disappears from your other devices. On this computer it stays as a song on this device only, which you can delete separately.', foot: 'Needs a connection.' }
    }[s];
    return { badge: T.badge, bBg: T.k[0], bFg: T.k[1], bRing: T.k[2], title: T.title, body: T.body, foot: T.foot };
  }
}
</script>
</body>
</html>
