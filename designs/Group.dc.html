<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Group detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
dc-import{display:block}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.f{fill:currentColor;stroke:none}
a:focus-visible,button:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
.rb{width:44px;height:44px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;background:#4C4C47;color:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.1);text-decoration:none;cursor:pointer;flex:none}
.row{position:relative;display:flex;align-items:center;gap:10px;min-height:72px;padding:6px 4px 6px 0;border-radius:16px;background:#4C4C47}
.grip{width:30px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;background:none;border:0;color:#ADA99E;cursor:grab;border-radius:8px}
.more{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:#FFFFFF;border-radius:10px;border:0;cursor:pointer}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:10px;background:none;color:#FFFFFF;font:500 15px 'Instrument Sans',sans-serif;text-align:left;cursor:pointer}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #2D2D2A; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif">
  <header style="padding: 52px 20px 0">
    <div style="display: flex; justify-content: space-between">
      <a class="rb" href="Library.dc.html" aria-label="Back to Library"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
      <button class="rb" type="button" aria-haspopup="menu" aria-label="Group options: rename group, delete group (playlists stay)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle class="f" cx="5" cy="12" r="1.7"></circle><circle class="f" cx="12" cy="12" r="1.7"></circle><circle class="f" cx="19" cy="12" r="1.7"></circle></svg></button>
    </div>
    <div style="margin-top: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #D9D5CA">GROUP</div>
    <h1 style="margin: 4px 0 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">Travel</h1>
    <p style="margin: 4px 0 0; font-size: 14px; color: #D9D5CA">3 playlists · 41 songs</p>

    <a href="SyncCloud.dc.html" style="margin-top: 14px; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 16px; background: #4C4C47; color: #FFFFFF; text-decoration: none">
      <span style="width: 40px; height: 40px; border-radius: 12px; background: #F26419; color: #161615; display: flex; align-items: center; justify-content: center; flex: none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="M12 13v8"></path><path d="m8 17 4-4 4 4"></path><path d="M20.4 15.6A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.3"></path></svg></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px; font-weight: 600">Sync to cloud</strong><span style="font-size: 12px; color: #CCC8BC">5 songs here are only on this phone</span></span>
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: #CCC8BC"><path d="m9 18 6-6-6-6"></path></svg>
    </a>
    <div style="margin-top: 16px; display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .04em; color: #D9D5CA">PLAYLISTS IN THIS GROUP</h2>
      <button type="button" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 12px; border: 0; background: transparent; color: #FFFFFF; font: 600 13px 'Instrument Sans', sans-serif; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35); cursor: pointer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 5v14M5 12h14"></path></svg>Add playlists</button>
    </div>
  </header>

  <ol aria-label="Playlists in Travel, group order" style="list-style: none; margin: 10px 0 0; padding: 0 12px 200px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{lists}}" as="p" hint-placeholder-count="3">
      <li class="row" style="z-index: {{p.z}}">
        <button class="grip" type="button" aria-label="Reorder {{p.name}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><circle class="f" cx="9" cy="6" r="1.5"></circle><circle class="f" cx="15" cy="6" r="1.5"></circle><circle class="f" cx="9" cy="12" r="1.5"></circle><circle class="f" cx="15" cy="12" r="1.5"></circle><circle class="f" cx="9" cy="18" r="1.5"></circle><circle class="f" cx="15" cy="18" r="1.5"></circle></svg></button>
        <a href="Playlist.dc.html" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none; border-radius: 10px">
          <span aria-hidden="true" style="position: relative; width: 56px; height: 56px; flex: none">
            <span style="position: absolute; left: 10px; top: 0; width: 46px; height: 46px; border-radius: 8px; background: #5E5E58"></span>
            <span style="position: absolute; left: 0; top: 10px; width: 46px; height: 46px; border-radius: 8px; background: #3A3A36; color: #E5DCC5; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="M21 15V6"></path><circle cx="18.5" cy="15.5" r="2.5"></circle><path d="M12 12H3"></path><path d="M16 6H3"></path><path d="M12 18H3"></path></svg></span>
          </span>
          <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-size: 16px; font-weight: 600">{{p.name}}</span><span style="font-size: 13px; color: #CCC8BC">{{p.meta}}</span></span>
        </a>
        <button class="more" type="button" onClick="{{p.toggle}}" aria-haspopup="menu" aria-expanded="{{p.expanded}}" aria-label="More actions for {{p.name}}" style="background: {{p.moreBg}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle class="f" cx="5" cy="12" r="1.7"></circle><circle class="f" cx="12" cy="12" r="1.7"></circle><circle class="f" cx="19" cy="12" r="1.7"></circle></svg></button>
        <sc-if value="{{p.open}}" hint-placeholder-val="{{ false }}">
          <div role="menu" aria-label="{{p.name}} actions" style="position: absolute; right: 8px; top: 64px; width: 262px; padding: 6px; border-radius: 16px; background: #3A3A36; box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 24px 40px -14px rgba(0,0,0,.9)">
            <button class="mi" type="button" role="menuitem"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: #E5DCC5"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>Rename playlist</button>
            <button class="mi" type="button" role="menuitem"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: #E5DCC5"><path d="M5 12h14"></path></svg>Remove from group</button>
            <div aria-hidden="true" style="height: 1px; margin: 4px 10px; background: rgba(255,255,255,.08)"></div>
            <button class="mi" type="button" role="menuitem" style="align-items: flex-start; padding-top: 10px; padding-bottom: 10px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; color: #F26419; margin-top: 1px"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg><span style="display: flex; flex-direction: column; gap: 2px"><span>Delete playlist…</span><span style="font-size: 12px; color: #CCC8BC">It leaves every group. Songs stay.</span></span></button>
          </div>
        </sc-if>
      </li>
    </sc-for>
  </ol>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 8">
    <dc-import name="MiniPlayer" hint-size="390px,80px"></dc-import>
    <dc-import name="TabBar" active="library" hint-size="390px,88px"></dc-import>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 1 };
  }
  renderVals() {
    const raw = [
      { name: 'Sunday Drive', meta: '14 songs · 52 min' },
      { name: 'Road Trip', meta: '19 songs · 1 h 11 min' },
      { name: 'Airport Lounge', meta: '11 songs · 44 min' }
    ];
    return {
      lists: raw.map((p, i) => {
        const open = this.state.open === i;
        return {
          ...p, open,
          z: open ? 3 : 1,
          expanded: open ? 'true' : 'false',
          moreBg: open ? '#3A3A36' : 'transparent',
          toggle: () => this.setState({ open: this.state.open === i ? -1 : i })
        };
      })
    };
  }
}
</script>
</body>
</html>
