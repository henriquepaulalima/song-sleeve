<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Song menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
a:focus-visible,button:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
.act{display:flex;align-items:center;gap:14px;width:100%;box-sizing:border-box;min-height:56px;padding:0 12px;border:0;border-radius:14px;background:transparent;color:#FFFFFF;font:500 16px 'Instrument Sans',sans-serif;text-align:left;text-decoration:none;cursor:pointer}
.act:disabled{cursor:not-allowed;color:#ADA99E}
.ic{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;background:#3A3A36;color:#E5DCC5}
.pl{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 12px;border:0;border-radius:12px;background:transparent;color:#FFFFFF;font:500 15px 'Instrument Sans',sans-serif;text-align:left;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2D2D2A; font-family: 'Instrument Sans', sans-serif; color: #FFFFFF">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(22,22,21,.72)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="t" style="position: absolute; left: 0; right: 0; bottom: 0; top: {{top}}; background: #4C4C47; border-radius: 28px 28px 0 0; padding: 10px 12px 30px; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 40px; height: 5px; border-radius: 5px; background: rgba(255,255,255,.3); margin: 0 auto"></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 6px; box-shadow: inset 0 -1px 0 rgba(255,255,255,.08)">
      <sc-if value="{{inPicker}}" hint-placeholder-val="{{ false }}">
        <button type="button" onClick="{{back}}" aria-label="Back to song actions" style="width: 44px; height: 44px; border-radius: 50%; border: 0; display: flex; align-items: center; justify-content: center; background: #3A3A36; color: #FFFFFF; cursor: pointer; flex: none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
      </sc-if>
      <sc-if value="{{inActions}}" hint-placeholder-val="{{ true }}">
        <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 10px; background: #3A3A36; color: #E5DCC5; display: flex; align-items: center; justify-content: center; flex: none"><svg class="i" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></span>
      </sc-if>
      <div style="flex: 1; min-width: 0">
        <h1 id="t" style="margin: 0; font-size: 17px; font-weight: 700">{{heading}}</h1>
        <p style="margin: 3px 0 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #CCC8BC"><span style="padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 700; background: {{bBg}}; color: {{bFg}}; box-shadow: {{bRing}}">{{badge}}</span>Marina Okafor</p>
      </div>
    </div>

    <sc-if value="{{inActions}}" hint-placeholder-val="{{ true }}">
      <div role="menu" aria-label="Song actions" style="margin-top: 6px; display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{actions}}" as="a" hint-placeholder-count="5">
          <sc-if value="{{a.isLink}}" hint-placeholder-val="{{ true }}">
            <a class="act" role="menuitem" href="{{a.href}}"><span class="ic" style="background: {{a.icBg}}; color: {{a.icFg}}">
              <sc-if value="{{a.ic.edit}}" hint-placeholder-val="{{ true }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg></sc-if>
              <sc-if value="{{a.ic.replace}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path><path d="M9 15h6"></path></svg></sc-if>
              <sc-if value="{{a.ic.link}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"></path><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"></path></svg></sc-if>
              <sc-if value="{{a.ic.trash}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg></sc-if>
              <sc-if value="{{a.ic.cloud}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M12 13v8"></path><path d="m8 17 4-4 4 4"></path><path d="M20.4 15.6A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.3"></path></svg></sc-if>
            </span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span>{{a.label}}</span><sc-if value="{{a.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #CCC8BC">{{a.sub}}</span></sc-if></span></a>
          </sc-if>
          <sc-if value="{{a.isButton}}" hint-placeholder-val="{{ false }}">
            <button class="act" role="menuitem" type="button" onClick="{{a.run}}" disabled="{{a.disabled}}"><span class="ic" style="background: {{a.icBg}}; color: {{a.icFg}}">
              <sc-if value="{{a.ic.add}}" hint-placeholder-val="{{ true }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M11 12H3"></path><path d="M16 6H3"></path><path d="M16 18H3"></path><path d="M18 9v6"></path><path d="M21 12h-6"></path></svg></sc-if>
              <sc-if value="{{a.ic.cloud}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M12 13v8"></path><path d="m8 17 4-4 4 4"></path><path d="M20.4 15.6A5 5 0 0 0 18 8h-1.26A8 8 0 1 0 4 16.3"></path></svg></sc-if>
              <sc-if value="{{a.ic.stop}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><circle cx="12" cy="12" r="9"></circle><path d="M9 9h6v6H9z"></path></svg></sc-if>
              <sc-if value="{{a.ic.retry}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"></path><path d="M3 21v-5h5"></path><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"></path><path d="M21 3v5h-5"></path></svg></sc-if>
              <sc-if value="{{a.ic.remove}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M5 12h14"></path></svg></sc-if>
            </span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span>{{a.label}}</span><sc-if value="{{a.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #CCC8BC">{{a.sub}}</span></sc-if></span>
            <sc-if value="{{a.soon}}" hint-placeholder-val="{{ false }}"><span style="padding: 3px 9px; border-radius: 999px; background: #3A3A36; color: #E5DCC5; font-size: 12px; font-weight: 700">Coming soon</span></sc-if></button>
          </sc-if>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{inPicker}}" hint-placeholder-val="{{ false }}">
      <ul aria-label="Playlists" style="list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{playlists}}" as="p" hint-placeholder-count="4">
          <li><button class="pl" type="button" role="checkbox" aria-checked="{{p.checked}}" onClick="{{p.toggle}}">
            <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 9px; background: #3A3A36; color: #E5DCC5; display: flex; align-items: center; justify-content: center; flex: none"><svg class="i" viewBox="0 0 24 24" style="width: 18px; height: 18px"><path d="M21 15V6"></path><circle cx="18.5" cy="15.5" r="2.5"></circle><path d="M12 12H3"></path><path d="M16 6H3"></path><path d="M12 18H3"></path></svg></span>
            <span style="flex: 1">{{p.name}}</span>
            <span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: {{p.boxBg}}; box-shadow: {{p.boxRing}}; color: #161615"><sc-if value="{{p.on}}" hint-placeholder-val="{{ false }}"><svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; stroke-width: 3"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
          </button></li>
        </sc-for>
      </ul>
      <a href="Songs.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: #F26419; color: #161615; font-size: 16px; font-weight: 700; text-decoration: none">Add</a>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"song":{"editor":"enum","options":["synced","local","localNoCloud","syncing","failed","relink","changed"],"default":"local"},"inPlaylist":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'actions', picked: { 'Late Night': true } };
  }
  renderVals() {
    const st = this.state;
    const song = this.props.song ?? 'local';
    const inPl = this.props.inPlaylist ?? false;
    const L = (label, href, ic, sub, danger) => ({ label, href, ic, sub, danger, isLink: true });
    const B = (label, ic, sub, extra) => ({ label, ic, sub, isButton: true, ...(extra || {}) });
    const edit = L('Edit', 'EditSong.dc.html', 'edit');
    const add = B('Add to playlist', 'add', '', { run: () => this.setState({ view: 'picker' }) });
    const replace = L('Replace audio file', 'UpdateSource.dc.html', 'replace');
    const del = L('Delete song', 'DeleteSong.dc.html', 'trash', '', true);
    const map = {
      synced: [edit, add, replace, del],
      local: [edit, add, replace, B('Sync to cloud', 'cloud', 'Upload it so all your devices have it'), del],
      localNoCloud: [edit, add, replace, B('Sync to cloud', 'cloud', '', { disabled: true, soon: true }), del],
      syncing: [edit, add, B('Cancel sync', 'stop', 'It stays on this phone'), del],
      failed: [B('Try again', 'retry', 'Sync failed: upload stopped'), edit, add, replace, del],
      relink: [L('Relink', 'UpdateSource.dc.html', 'link', 'Find the file again'), edit, add, del],
      changed: [L('Use changed file', 'UpdateSource.dc.html', 'replace', 'Read the file again and review'), edit, add, del]
    };
    let acts = map[song].slice();
    if (inPl) acts.splice(acts.length - 1, 0, B('Remove from playlist', 'remove', 'The song stays in your library'));
    const badges = {
      synced: ['Synced', 'quiet'], local: ['On this device', 'outline'], localNoCloud: ['On this device', 'outline'],
      syncing: ['Syncing… 42%', 'progress'], failed: ['Sync failed', 'alert'], relink: ['Relink needed', 'alert'], changed: ['File changed', 'alert']
    };
    const K = { quiet: ['transparent', '#D9D5CA', 'none'], outline: ['transparent', '#EDEAE2', 'inset 0 0 0 1px rgba(255,255,255,.35)'], progress: ['#3A3A36', '#E5DCC5', 'none'], alert: ['#E5DCC5', '#161615', 'none'] };
    const [badge, kind] = badges[song];
    const ICONS = ['edit', 'replace', 'link', 'trash', 'cloud', 'add', 'stop', 'retry', 'remove'];
    const inPicker = st.view === 'picker';
    return {
      inPicker, inActions: !inPicker,
      top: inPicker ? '300px' : (acts.length > 5 ? '330px' : '380px'),
      heading: inPicker ? 'Add “Undertow” to playlists' : 'Undertow',
      badge, bBg: K[kind][0], bFg: K[kind][1], bRing: K[kind][2],
      back: () => this.setState({ view: 'actions' }),
      actions: acts.map((a) => {
        const ic = {};
        ICONS.forEach((k) => { ic[k] = k === a.ic; });
        return {
          ...a, ic,
          isLink: !!a.isLink, isButton: !!a.isButton,
          hasSub: !!a.sub, disabled: !!a.disabled, soon: !!a.soon,
          run: a.run ?? (() => {}),
          icBg: a.danger ? '#F26419' : '#3A3A36',
          icFg: a.danger ? '#161615' : '#E5DCC5'
        };
      }),
      playlists: ['Sunday Drive', 'Late Night', 'Focus', 'Kitchen Radio'].map((name) => {
        const on = !!st.picked[name];
        return { name, on, checked: on ? 'true' : 'false', boxBg: on ? '#E5DCC5' : 'transparent', boxRing: on ? 'none' : 'inset 0 0 0 2px #CCC8BC', toggle: () => this.setState({ picked: { ...this.state.picked, [name]: !on } }) };
      })
    };
  }
}
</script>
</body>
</html>
