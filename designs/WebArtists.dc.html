<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Artists · desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=Instrument+Sans:wght@400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#2D2D2A}
dc-import{display:block;width:100%}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.f{fill:currentColor;stroke:none}
a:focus-visible,button:focus-visible{outline:2px solid #E5DCC5;outline-offset:2px}
.arow{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:6px 12px 6px 8px;border:0;border-radius:14px;color:#FFFFFF;font-family:'Instrument Sans',sans-serif;text-align:left;cursor:pointer}
.mono{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Archivo',sans-serif;font-stretch:125%;font-weight:800;font-size:17px}
.th{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;color:#D9D5CA}
.hb{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;border:0;background:transparent;color:#FFFFFF;font:600 14px 'Instrument Sans',sans-serif;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4);cursor:pointer}
.hb:disabled{color:#ADA99E;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.18);cursor:not-allowed}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-direction: column; background: #2D2D2A; color: #FFFFFF; font-family: 'Instrument Sans', sans-serif">
  <div style="flex: 1; display: flex; flex-wrap: wrap; align-items: stretch">
    <div style="flex: 1 1 240px; max-width: 100%; display: flex; background: #4C4C47; box-shadow: 1px 0 0 rgba(255,255,255,.06)"><dc-import name="WebSidebar" active="artists" hint-size="100%,900px"></dc-import></div>
    <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px clamp(16px, 3vw, 40px) 48px">
      <div style="max-width: 1120px; margin: 0 auto">
        <h1 style="margin: 0; font-family: 'Archivo', sans-serif; font-stretch: 118%; font-weight: 800; font-size: 40px; letter-spacing: -0.02em">Artists</h1>
        <p style="margin: 4px 0 0; font-size: 15px; color: #D9D5CA">18 artists</p>
        <div style="margin-top: 24px; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
          <ul aria-label="Artists" style="flex: 1 1 260px; max-width: 100%; list-style: none; margin: 0; padding: 8px; border-radius: 20px; background: #3A3A36; display: flex; flex-direction: column; gap: 2px">
            <sc-for list="{{artists}}" as="a" hint-placeholder-count="8">
              <li><button class="arow" type="button" onClick="{{a.pick}}" aria-current="{{a.cur}}" style="background: {{a.bg}}">
                <span class="mono" aria-hidden="true" style="background: {{a.monoBg}}; color: {{a.monoFg}}">{{a.initial}}</span>
                <span style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-size: 15px; font-weight: {{a.w}}">{{a.name}}</span><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #CCC8BC"><sc-if value="{{a.local}}" hint-placeholder-val="{{ false }}"><span style="padding: 1px 6px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #EDEAE2; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35)">On this device</span></sc-if>{{a.count}}</span></span>
              </button></li>
            </sc-for>
          </ul>
          <section aria-labelledby="art-name" style="flex: 999 1 560px; min-width: 0">
            <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
              <span aria-hidden="true" style="width: 116px; height: 116px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; background: repeating-radial-gradient(circle at center, #161615 0 2px, #222220 2px 4px); box-shadow: 0 18px 30px -14px rgba(0,0,0,.85)"><span style="width: 56px; height: 56px; border-radius: 50%; background: #E5DCC5; color: #161615; display: flex; align-items: center; justify-content: center; font-family: 'Archivo', sans-serif; font-stretch: 125%; font-weight: 800; font-size: 24px">{{sel.initial}}</span></span>
              <div style="flex: 1 1 220px; min-width: 0">
                <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .16em; color: #D9D5CA">ARTIST</div>
                <h2 id="art-name" style="margin: 6px 0 0; font-family: 'Archivo', sans-serif; font-stretch: 112%; font-weight: 800; font-size: 34px; letter-spacing: -0.02em; line-height: 1.1">{{sel.name}}</h2>
                <p style="margin: 6px 0 0; font-size: 14px; color: #D9D5CA">{{sel.count}} · in library order</p>
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 8px">
                <a href="WebPlaying.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 22px 0 18px; border-radius: 16px; background: #F26419; color: #161615; font-weight: 700; font-size: 15px; text-decoration: none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path class="f" d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"></path></svg>Play</a>
                <sc-if value="{{sel.server}}" hint-placeholder-val="{{ true }}">
                  <a class="hb" href="WebCollectionDialogs.dc.html" style="text-decoration: none"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>Rename</a>
                  <button class="hb" type="button" disabled title="Available when no song uses this artist"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>Delete</button>
                </sc-if>
              </div>
            </header>
            <sc-if value="{{sel.local}}" hint-placeholder-val="{{ false }}">
              <p style="margin: 14px 0 0; display: flex; gap: 8px; padding: 10px 12px; border-radius: 12px; background: #3A3A36; font-size: 13px; color: #EDEAE2"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px; margin-top: 1px; color: #E5DCC5"><circle cx="12" cy="12" r="9"></circle><path d="M12 8h.01"></path><path d="M11 12h1v4h1"></path></svg>This name is only used by songs on this computer. It joins your account when one of them syncs.</p>
            </sc-if>
            <sc-if value="{{sel.server}}" hint-placeholder-val="{{ true }}">
              <p style="margin: 14px 0 0; font-size: 13px; color: #CCC8BC">Delete is available once no song uses this artist.</p>
            </sc-if>
            <div style="margin-top: 18px; overflow-x: auto">
              <div style="min-width: 560px; display: flex; flex-direction: column; gap: 6px">
                <div aria-hidden="true" style="display: grid; grid-template-columns: minmax(0,2.2fr) 230px 56px 44px; column-gap: 12px; padding: 0 6px 4px"><span class="th">TITLE</span><span class="th">STATUS</span><span class="th" style="text-align: right">TIME</span><span></span></div>
                <ol aria-label="Songs by {{sel.name}}" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
                  <sc-for list="{{songs}}" as="s" hint-placeholder-count="6">
                    <li><dc-import name="WebSongRow" item="{{s}}" hint-size="100%,60px"></dc-import></li>
                  </sc-for>
                </ol>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <div style="position: sticky; bottom: 0; z-index: 5; background: #4C4C47; box-shadow: 0 -16px 30px -16px rgba(0,0,0,.6)"><dc-import name="WebPlayer" hint-size="100%,84px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'Marina Okafor' };
  }
  renderVals() {
    const S = (name, status, pct, playing) => ({ name, status, pct, playing, grip: false, showArtist: false, dur: '3:' + String((10 + name.length * 7) % 60).padStart(2, '0') });
    const data = {
      'Ines Caldera': [S('Night Market', 'syncing', 42), S('Lanterns', 'synced'), S('Two Rivers', 'local'), S('Quiet Street', 'synced')],
      'Juniper Hall': [S('Saltwater Hymn', 'queued'), S('Fieldnotes', 'synced'), S('Pinewood', 'synced')],
      'Marigold Trio': [S('Brass Lullaby', 'synced'), S('Swing for Two', 'synced'), S('Porch Light', 'local')],
      'Marina Okafor': [S('Harbor Lights', 'synced', 0, true), S('Undertow', 'relink'), S('Paper Moons', 'syncing', 18), S('Tidewater', 'updating', 70), S('Blue Hour', 'synced'), S('Ember Season', 'needsDownload')],
      'Northbound Static': [S('Glass Garden', 'changed'), S('Signal Fire', 'synced'), S('Overpass', 'synced')],
      'Paulo Verde': [S('Late Train to Lisbon', 'failed'), S('Alfama', 'synced')],
      'The Low Tides': [S('Copper Sky', 'downloading', 30), S('Morning Ferry', 'waiting'), S('Driftwood', 'local')],
      'Wren Atlas': [S('Lowland', 'local'), S('Fen Song', 'local')]
    };
    const localOnly = { 'Wren Atlas': true };
    const sel = this.state.sel;
    const cnt = (n) => n + (n === 1 ? ' song' : ' songs');
    return {
      artists: Object.keys(data).map((name) => {
        const on = name === sel;
        return { name, local: !!localOnly[name], initial: name.charAt(0), count: cnt(data[name].length), cur: on ? 'true' : 'false', bg: on ? '#4C4C47' : 'transparent', w: on ? '700' : '500', monoBg: on ? '#E5DCC5' : '#4C4C47', monoFg: on ? '#161615' : '#E5DCC5', pick: () => this.setState({ sel: name }) };
      }),
      songs: data[sel],
      sel: { name: sel, initial: sel.charAt(0), count: cnt(data[sel].length), local: !!localOnly[sel], server: !localOnly[sel] }
    };
  }
}
</script>
</body>
</html>
